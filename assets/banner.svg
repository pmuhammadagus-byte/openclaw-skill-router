<svg width="860" height="320" viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1340"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#19e3ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#19e3ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="320" rx="22" fill="url(#bg)"/>

  <!-- Brand mark: compass/router dial -->
  <g filter="url(#glow)">
    <circle cx="118" cy="118" r="58" fill="url(#mark)"/>
  </g>
  <circle cx="118" cy="118" r="58" fill="none" stroke="#0b1020" stroke-width="6"/>
  <!-- needle -->
  <path d="M118 78 L133 130 L118 118 L103 130 Z" fill="#0b1020"/>
  <circle cx="118" cy="118" r="9" fill="#0b1020"/>
  <!-- ticks -->
  <g stroke="#cfd8ff" stroke-width="3" opacity="0.7">
    <line x1="118" y1="62" x2="118" y2="74"/>
    <line x1="118" y1="162" x2="118" y2="174"/>
    <line x1="62" y1="118" x2="74" y2="118"/>
    <line x1="162" y1="118" x2="174" y2="118"/>
  </g>

  <!-- Title + tagline -->
  <text x="210" y="96" fill="#ffffff" font-size="46" font-weight="bold">Skill Router</text>
  <text x="212" y="138" fill="#9fb0d9" font-size="19">Route any task to the best skill in YOUR catalog — automatically.</text>
  <rect x="210" y="160" width="470" height="3" rx="1.5" fill="url(#brand)"/>

  <!-- Feature pills -->
  <g>
    <rect x="210" y="186" width="126" height="40" rx="20" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="228" y="211" fill="#cbd5e1" font-size="15" font-weight="bold">🎯 Auto-routing</text>
    <rect x="348" y="186" width="118" height="40" rx="20" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="366" y="211" fill="#cbd5e1" font-size="15" font-weight="bold">⚡ Local</text>
    <rect x="478" y="186" width="132" height="40" rx="20" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="496" y="211" fill="#cbd5e1" font-size="15" font-weight="bold">🔗 ClawHub</text>
    <rect x="622" y="186" width="124" height="40" rx="20" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="640" y="211" fill="#cbd5e1" font-size="15" font-weight="bold">🍴 Forkable</text>
  </g>

  <!-- Install hint -->
  <text x="212" y="262" fill="#64748b" font-size="14">Install:</text>
  <rect x="282" y="244" width="430" height="34" rx="10" fill="#0b1020" stroke="#2a335c"/>
  <text x="298" y="266" fill="#19e3ff" font-size="14" font-weight="bold" font-family="monospace">openclaw plugins install clawhub:&lt;owner&gt;/openclaw-skill-router</text>

  <!-- Footer -->
  <text x="212" y="300" fill="#6d5efc" font-size="14" font-weight="bold">✦ Made with Clara · OpenClaw plugin · generic &amp; reusable</text>
</svg>
