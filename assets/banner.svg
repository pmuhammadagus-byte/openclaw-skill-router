<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1340"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2548"/>
      <stop offset="1" stop-color="#141a35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#6d5efc"/>
    </marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="900" height="500" rx="18" fill="url(#bg)"/>

  <!-- Hero brand bar -->
  <g filter="url(#glow)">
    <rect x="0" y="0" width="900" height="92" fill="url(#hero)"/>
  </g>
  <text x="36" y="44" fill="#0b1020" font-size="30" font-weight="800">🧭 Skill Router</text>
  <text x="36" y="72" fill="#0b1020" font-size="14" font-weight="600">OpenClaw plugin · task → best skill, automatically</text>

  <!-- Install pill -->
  <g filter="url(#glow)">
    <rect x="600" y="22" width="266" height="48" rx="24" fill="#0b1020"/>
  </g>
  <text x="620" y="52" fill="#22d3ee" font-size="14" font-weight="700">$ openclaw plugins install</text>
  <text x="620" y="52" fill="#22d3ee" font-size="14" font-weight="700" dx="150"> clawhub:&lt;owner&gt;/openclaw-skill-router</text>

  <!-- Feature chips -->
  <g>
    <rect x="36" y="112" width="150" height="36" rx="18" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="56" y="135" fill="#cbd5e1" font-size="13" font-weight="600">🎯 Auto-routing</text>
    <rect x="200" y="112" width="170" height="36" rx="18" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="220" y="135" fill="#cbd5e1" font-size="13" font-weight="600">⚡ Local, no API</text>
    <rect x="384" y="112" width="180" height="36" rx="18" fill="#1e2548" stroke="#3a4a7a"/>
    <text x="404" y="135" fill="#cbd5e1" font-size="13" font-weight="600">🔗 ClawHub links</text>
  </g>

  <!-- Section: how it works -->
  <text x="36" y="186" fill="#ffffff" font-size="17" font-weight="700">How it works</text>

  <!-- Input -->
  <g filter="url(#glow)"><rect x="36" y="206" width="210" height="116" rx="14" fill="#0f1530" stroke="#3a4a7a"/></g>
  <text x="56" y="234" fill="#7dd3fc" font-size="13" font-weight="700">USER TASK</text>
  <text x="56" y="260" fill="#e2e8f0" font-size="13">"Scrape data dari web</text>
  <text x="56" y="280" fill="#e2e8f0" font-size="13">lalu rangkum jadi PDF"</text>
  <text x="56" y="306" fill="#94a3b8" font-size="12">input: task (string)</text>

  <path d="M246 264 C 284 264, 294 264, 332 264" stroke="#6d5efc" stroke-width="3" fill="none" marker-end="url(#ar)"/>

  <!-- Router -->
  <g filter="url(#glow)"><rect x="334" y="206" width="200" height="116" rx="16" fill="url(#hero)"/></g>
  <text x="354" y="250" fill="#0b1020" font-size="16" font-weight="800">skill_router</text>
  <text x="354" y="276" fill="#0b1020" font-size="12" font-weight="600">tokenize → score</text>
  <text x="354" y="296" fill="#0b1020" font-size="12" font-weight="600">→ rank top-N</text>
  <text x="354" y="316" fill="#0b1020" font-size="11">reads your skills.json</text>

  <path d="M534 264 C 572 264, 582 264, 620 264" stroke="#22d3ee" stroke-width="3" fill="none" marker-end="url(#ar2)"/>

  <!-- Output cards -->
  <g filter="url(#glow)"><rect x="622" y="200" width="240" height="56" rx="12" fill="url(#card)" stroke="#3a4a7a"/></g>
  <text x="638" y="224" fill="#fbbf24" font-size="13" font-weight="700">1. web-scraper</text>
  <text x="638" y="244" fill="#cbd5e1" font-size="11">score 17 · extract from sites</text>

  <g filter="url(#glow)"><rect x="622" y="262" width="240" height="56" rx="12" fill="url(#card)" stroke="#3a4a7a"/></g>
  <text x="638" y="286" fill="#34d399" font-size="13" font-weight="700">2. pdf-summarizer</text>
  <text x="638" y="306" fill="#cbd5e1" font-size="11">score 13 · concise summary</text>

  <g filter="url(#glow)"><rect x="622" y="324" width="240" height="56" rx="12" fill="url(#card)" stroke="#3a4a7a"/></g>
  <text x="638" y="348" fill="#60a5fa" font-size="13" font-weight="700">3. doc-builder</text>
  <text x="638" y="368" fill="#cbd5e1" font-size="11">score 9 · assemble to PDF</text>

  <!-- footer -->
  <text x="36" y="430" fill="#94a3b8" font-size="15" font-weight="700">Perfect for: large skill libraries, teams sharing skills, or anyone tired of searching manually.</text>
  <text x="36" y="456" fill="#64748b" font-size="11">OpenClaw plugin · generic & reusable · fork it, star it, make it yours</text>
  <text x="36" y="476" fill="#64748b" font-size="11">Plug in your own skills.json and the router serves YOUR catalog.</text>
</svg>
